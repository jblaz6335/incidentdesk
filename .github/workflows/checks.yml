name: Verified application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: incidentdesk
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: incidentdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U incidentdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://incidentdesk:test-only-password@localhost:5432/incidentdesk_test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Verify migration round trip
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
        working-directory: backend
  browser-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start reproducible demo
        run: python scripts/demo.py
      - name: Browser workflow and accessibility checks
        run: npm run test:e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
      - name: Container state on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results
      - if: always()
        run: docker compose down -v
